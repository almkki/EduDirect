<!DOCTYPE html>
<html>
<head>
  <title>AI Career Recommender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 500px; /* تعديل الحجم ليطابق gpa */
      margin: 80px auto; /* توسيط الصفحة */
      padding: 30px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: bold;
      margin-bottom: 10px;
    }

    select {
      height: 200px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      background-color: #007BFF;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>AI Career Recommender</h2>
    <form method="post" action="/predict_career">
      <label for="skills">Select your skills:</label>
      <select id="skills" name="skills" multiple>
        {% for skill in skills %}
          <option value="{{ skill }}">{{ skill }}</option>
        {% endfor %}
      </select>
      <button type="submit">Get Career Recommendation</button>
    </form>
  </div>
</body>
</html>
